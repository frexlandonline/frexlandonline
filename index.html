<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="BlockDrop - Juego de puzzle de bloques con integración Web3. Conecta tu wallet, compite en el leaderboard y gana recompensas en Polygon.">
  <meta name="theme-color" content="#120024">
  <title>FrexLand | Arcade del Futuro</title>
  
  <!-- SEO & Open Graph Meta Tags -->
  <meta property="og:title" content="FrexLand | Arcade del Futuro">
  <meta property="og:description" content="BlockDrop - Juego de puzzle de bloques con integración Web3. Conecta tu wallet, compite en el leaderboard y gana recompensas en USDC usando la tecnología de Worldcoin y Base.">
  <meta property="og:image" content="https://frexland.online/assets/preview.jpg">
  <meta property="og:url" content="https://frexland.online">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://frexland.online/assets/preview.jpg">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <div class="loading-overlay" style="position: fixed; inset: 0; background: radial-gradient(circle at center, #2a0845 0%, #120024 70%, #0c0018 100%), #120024; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
      <div style="font-size: 2.5rem; margin-bottom: 10px; filter: drop-shadow(0 0 12px rgba(255, 140, 0, 0.7));">🕹️</div>
      <div style="font-family: 'Press Start 2P', cursive, monospace; font-size: clamp(1rem, 4vw, 1.3rem); color: #ffeb3b; text-shadow: 3px 3px 0 #9400d3, 0 0 15px rgba(255, 235, 59, 0.5); letter-spacing: 2px; margin-bottom: 24px; text-align: center;">FREXLAND</div>
      <div style="width: 80%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="color: #ffeb3b; font-family: 'Press Start 2P', cursive, monospace; font-size: clamp(0.9rem, 3.5vw, 1.2rem); text-shadow: 2px 2px 0 #9400d3, 0 0 10px rgba(255, 140, 0, 0.6);" id="loading-text">0%</div>
        <div style="width: 100%; height: 20px; background: rgba(0, 0, 0, 0.8); border: 3px solid #ff8c00; border-radius: 6px; padding: 2px; overflow: hidden; box-shadow: 0 0 15px rgba(255, 140, 0, 0.35), inset 0 0 8px rgba(0, 0, 0, 0.9);">
          <div id="loading-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c00, #ffeb3b 50%, #39ff14 100%); box-shadow: 0 0 10px #39ff14; border-radius: 2px; transition: width 0.1s ease-out;"></div>
        </div>
      </div>
      <span id="loading-status" style="color: #39ff14; font-family: 'Press Start 2P', cursive, monospace; margin-top: 24px; font-size: clamp(0.55rem, 2.2vw, 0.68rem); letter-spacing: 1px; text-align: center; text-shadow: 0 0 8px rgba(57, 255, 20, 0.5); max-width: 90%; line-height: 1.6;">INICIALIZANDO ARCADE...</span>
    </div>
    <script>
      let _p = 0;
      const _b = document.getElementById('loading-bar');
      const _t = document.getElementById('loading-text');
      const _s = document.getElementById('loading-status');
      const _stages = [
        { p: 20, m: "CARGANDO ASSETS VISUALES..." },
        { p: 45, m: "INSERTANDO FICHAS ARCADE..." },
        { p: 70, m: "CONECTANDO ENTORNO WEB3..." },
        { p: 90, m: "¡PREPARANDO PARTIDA!" }
      ];
      let _stageIdx = 0;
      const _i = setInterval(() => {
        _p += Math.floor(Math.random() * 6) + 1;
        if (_p >= 99) { _p = 99; clearInterval(_i); }
        if (_b && _t) { 
          _b.style.width = _p + '%'; 
          _t.innerText = _p + '%'; 
          if (_s && _stageIdx < _stages.length && _p >= _stages[_stageIdx].p) {
            _s.innerText = _stages[_stageIdx].m;
            _stageIdx++;
          }
        }
      }, 40);
      window.finishLoadingBar = () => {
        clearInterval(_i);
        if (_b && _t) { _b.style.width = '100%'; _t.innerText = '100%'; }
        if (_s) _s.innerText = "¡PRESS START!";
      };
    </script>
  </div>
  
  <!-- Web3 Ad Banner Container (A-Ads / CoinZilla) -->
  <div id="web3-ad-container" style="display: none; width: 100%; text-align: center; background: #120024; border-top: 1px solid rgba(255, 140, 0, 0.3); padding: 5px 0; z-index: 1000; position: fixed; bottom: 0; left: 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);">
    <div style="color: #666; font-size: 0.5rem; font-family: 'Press Start 2P', cursive; margin-bottom: 4px;">PUBLICIDAD</div>
    <!-- Aquí irá el script o iframe real de la red de anuncios (ej. A-Ads) -->
    <iframe data-aa="2449644" src="//acceptable.a-ads.com/2449644/?size=Adaptive" style="border:0; padding:0; width:100%; max-width:320px; height:50px; overflow:hidden; margin: auto;"></iframe>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
